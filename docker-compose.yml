version: "3.9"

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_NESTJS_URL=${NEXT_PUBLIC_NESTJS_URL:-http://localhost:3001}
        - NEXT_PUBLIC_FASTAPI_URL=${NEXT_PUBLIC_FASTAPI_URL:-http://localhost:8000}
        - NEXT_PUBLIC_GATEWAY_URL=${NEXT_PUBLIC_GATEWAY_URL:-http://localhost:8003}
        - NEXT_PUBLIC_METABASE_URL=${NEXT_PUBLIC_METABASE_URL:-http://localhost:3002}
    container_name: healthai-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_NESTJS_URL=${NEXT_PUBLIC_NESTJS_URL}
      - NEXT_PUBLIC_FASTAPI_URL=${NEXT_PUBLIC_FASTAPI_URL}
      - NEXT_PUBLIC_GATEWAY_URL=${NEXT_PUBLIC_GATEWAY_URL}
      - NEXT_PUBLIC_METABASE_URL=${NEXT_PUBLIC_METABASE_URL}
      - NEXT_PUBLIC_API_KEY=${NEXT_PUBLIC_API_KEY}
      - NEXT_PUBLIC_CLIENT_ID=${NEXT_PUBLIC_CLIENT_ID}
    networks:
      - healthai-network
    restart: unless-stopped

networks:
  healthai-network:
    external: true  # Réseau partagé avec le backend NestJS et Metabase
